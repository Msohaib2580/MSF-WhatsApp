name: Debug Repository Files

on:
  workflow_dispatch:
  push:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: List All Files
        run: |
          echo "=== Displaying Repository Directory Structure ==="
          find . -maxdepth 3 -not -path '*/.*'
