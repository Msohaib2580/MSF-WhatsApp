name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract ZIP (if any)
        run: |
          ZIP=$(find . -iname "*.zip" -not -path "./.git/*" | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Found: $ZIP"
            unzip -oq "$ZIP" -d extracted
          fi

      - name: Locate Flutter Project
        run: |
          P=$(find . -name pubspec.yaml -not -path "./.git/*" | head -n 1)
          if [ -z "$P" ]; then
            echo "Error: pubspec.yaml not found!"
            ls -R | head -60
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$P")" >> $GITHUB_ENV
          echo "Project at: $(dirname "$P")"

      - name: Generate Android files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cp -r lib /tmp/lib_bak
          flutter create --platforms=android --org com.msf --project-name msf_chatapp .
          rm -rf lib && cp -r /tmp/lib_bak lib
          rm -rf test
          sed -i 's/flutter.minSdkVersion/23/' android/app/build.gradle*

      - name: Get packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Force compileSdk 36
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/force-sdk.gradle << 'EOF'
          allprojects { p ->
            p.afterEvaluate {
              if (p.hasProperty('android')) {
                p.android.compileSdkVersion(36)
              }
            }
          }
          EOF

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
