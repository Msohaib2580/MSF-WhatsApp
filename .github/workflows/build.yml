name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract ZIP File Automatically
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            unzip -q "$ZIP_FILE" -d project_extracted
          else
            echo "No zip file found, proceeding with root files..."
          fi

      - name: Locate Android Project
        id: locate
        run: |
          BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: build.gradle not found anywhere!"
            exit 1
          fi
          DIR=$(dirname "$BUILD_FILE")
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Make Gradlew Executable
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
