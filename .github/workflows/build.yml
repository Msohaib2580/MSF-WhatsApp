name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract ZIP File
        run: |
          ZIP=$(find . -iname "*.zip" -not -path "./.git/*" | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Found: $ZIP"
            unzip -o "$ZIP" -d extracted
          else
            echo "No ZIP found"
          fi

      - name: Show Files
        run: ls -R | head -60

      - name: Locate Android Project
        run: |
          S=$(find . \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -not -path "./.git/*" | head -n 1)
          if [ -z "$S" ]; then
            echo "Error: Android project not found!"
            exit 1
          fi
          DIR=$(dirname "$S")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          echo "Project at: $DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
